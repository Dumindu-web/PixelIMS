
name: Build PixelIMS Android 17

on:
  push:
    branches:
      - main
      - fix/android-17-stability

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android 17 Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelIMS-Android17-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

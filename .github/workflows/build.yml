
name: PixelIMS Android 17 Build

on:
  push:
    branches:
      - main
      - fix/android-17-stability

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android 17 Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Show available Android SDK packages
        run: |
          sdkmanager --list | grep -E \
            'platforms;android-37|build-tools;37'

      - name: Install Android 17 SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Create Android 37 compatibility alias
        run: |
          SDK_PLATFORMS="$ANDROID_HOME/platforms"

          if [ -d "$SDK_PLATFORMS/android-37.0" ]; then
            if [ ! -e "$SDK_PLATFORMS/android-37" ]; then
              ln -s android-37.0 \
                "$SDK_PLATFORMS/android-37"
            fi
          else
            echo "Android 37.0 SDK platform not found"
            exit 1
          fi

          ls -la "$SDK_PLATFORMS"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelIMS-Android17-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
